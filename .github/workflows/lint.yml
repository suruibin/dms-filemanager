name: lint

on: [push, pull_request]

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev

      - name: qmllint (fail on errors only)
        run: |
          out=$(/usr/lib/qt6/bin/qmllint $(git ls-files '*.qml') 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q ": Error:"; then
            echo "::error::qmllint reported errors"
            exit 1
          fi
